---
name: "Feature Request"
description: "Suggest a new feature for the Poseidon backend."
title: "[Feature] "
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion! Please fill out the form below.
  - type: input
    id: summary
    attributes:
      label: "Summary"
      description: "Short summary of the feature."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: "Motivation"
      description: "Why is this feature important?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
    validations:
      required: false

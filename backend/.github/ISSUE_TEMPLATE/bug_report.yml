---
name: "Bug Report"
description: "Report a bug in the Poseidon backend."
title: "[Bug] "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below.
  - type: input
    id: summary
    attributes:
      label: "Summary"
      description: "Short summary of the bug."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce the bug?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Node.js version, database, etc."
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
    validations:
      required: false

name: Governance Closeout Strict

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-closeout-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-closeout-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict closeout check
        id: strict_closeout
        continue-on-error: true
        run: node scripts/governance/check-go-live-closeout.mjs --strict

      - name: Publish closeout summary
        if: always()
        shell: bash
        run: |
          if [ -f governance-artifacts/go-live-closeout-report.json ]; then
            node - <<'NODE'
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('governance-artifacts/go-live-closeout-report.json', 'utf8'));
            const lines = [];
            lines.push('## Governance Closeout Strict');
            lines.push('');
            lines.push(`- strict mode: \`${report.strictMode ? 'true' : 'false'}\``);
            lines.push(`- result: **${report.ok ? 'PASS' : 'FAIL'}**`);
            lines.push(`- report: \`${report.reportFile}\``);
            lines.push('');
            lines.push('### Section Status');
            for (const section of report.sections || []) {
              const evidence = section.hasRealEvidence ? 'evidence-linked' : 'no-evidence';
              lines.push(`- ${section.number}) ${section.title}: \`${section.completed}/${section.total}\` (${evidence})`);
            }
            if (Array.isArray(report.strictFailures) && report.strictFailures.length > 0) {
              lines.push('');
              lines.push('### Strict Failures');
              for (const failure of report.strictFailures) {
                lines.push(`- ${failure}`);
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            NODE
          else
            echo "## Governance Closeout Strict" >> "$GITHUB_STEP_SUMMARY"
            echo "- result: **FAIL**" >> "$GITHUB_STEP_SUMMARY"
            echo "- report was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload closeout report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-closeout-report
          path: governance-artifacts/go-live-closeout-report.json

      - name: Enforce strict gate result
        if: steps.strict_closeout.outcome != 'success'
        run: |
          echo "Strict closeout check failed. See summary and report artifact." >&2
          exit 1

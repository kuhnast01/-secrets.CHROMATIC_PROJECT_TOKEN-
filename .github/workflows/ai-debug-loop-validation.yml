name: AI Debug Loop Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-debug-loop-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-debug-loop-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI-02 debug loop drill
        run: pnpm --dir backend exec tsx scripts/liveops/run-ai-debug-loop-drill.ts

      - name: Upload AI-02 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-loop-artifacts
          path: |
            backend/tmp/liveops-artifacts/ai-02-debug-loop-*.json
            backend/tmp/ai-debug-loop/**/debug.log
            backend/tmp/ai-debug-loop/**/test-results.json
            backend/tmp/ai-debug-loop/**/remediation-proposals.json

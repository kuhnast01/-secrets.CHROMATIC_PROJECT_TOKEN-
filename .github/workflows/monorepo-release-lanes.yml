name: Monorepo Release Lanes

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-release-lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mono-release-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MONO-02 strict release lane check
        run: node scripts/governance/check-mono-release-lanes.mjs --strict

      - name: Upload MONO-02 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-release-lanes-report
          path: governance-artifacts/mono-release-lanes-report.json

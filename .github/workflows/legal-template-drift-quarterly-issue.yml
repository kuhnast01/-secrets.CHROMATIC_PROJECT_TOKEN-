name: Legal Template Drift Quarterly Issue

on:
  schedule:
    - cron: "25 9 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      legalReviewAssignees:
        description: Comma-separated GitHub usernames to assign (overrides repository variable for this run)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: legal-template-drift-quarterly-issue
  cancel-in-progress: true

jobs:
  quarterly-legal-drift-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEGAL_REVIEW_ASSIGNEES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.legalReviewAssignees || vars.LEGAL_REVIEW_ASSIGNEES || '' }}
    steps:
      - name: Upsert quarterly legal drift review issue
        id: upsert_legal_issue
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- legal-template-drift-quarterly-issue -->';
            const title = 'Legal: Quarterly template drift and self-test review';
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');

            const targetFiles = [
              'GOVERNANCE_CONTROLS_MATRIX.md',
              'scripts/legal/release-record-schema.mjs',
              'scripts/legal/check-release-records.mjs',
              'scripts/legal/check-release-template-drift.mjs',
              'scripts/legal/fixtures/APPROVAL_RECORD_TEMPLATE_MISSING_FOUNDER.md',
              '.github/workflows/legal-release-record-check.yml',
              'legal/APPROVAL_RECORD_TEMPLATE.md',
              'legal/LEGAL_RELEASE_BUNDLE_CHECKLIST.md',
              'legal/LEGAL_GOVERNANCE_RUNBOOK.md',
              'legal/README.md',
            ];

            const configuredLabels = ['legal', 'governance', 'security', 'kpi:legal-drift-review'];
            let labels = [];
            try {
              const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
                owner,
                repo,
                per_page: 100,
              });
              const available = new Set(repoLabels.map((label) => label.name));
              labels = configuredLabels.filter((label) => available.has(label));
            } catch (error) {
              core.warning(`Unable to resolve repository labels: ${error.message}`);
            }

            const configuredAssignees = (process.env.LEGAL_REVIEW_ASSIGNEES || '')
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const assignees = [];
            for (const username of configuredAssignees) {
              try {
                await github.rest.users.getByUsername({ username });
                assignees.push(username);
              } catch (error) {
                core.warning(`Skipping unknown assignee '${username}': ${error.message}`);
              }
            }

            const fileChecklist = targetFiles
              .map((filePath) => `- [ ] Review [${filePath}](../blob/${branch}/${filePath}) for drift and update if required.`)
              .join('\n');

            const body = [
              marker,
              '## Quarterly Legal Drift Review',
              '',
              `- workflow run: ${runUrl}`,
              '- objective: ensure legal release schema, templates, and negative self-test remain aligned and meaningful.',
              '',
              '### Review checklist',
              fileChecklist,
              '- [ ] Confirm `legal-release-record-check` workflow summary still reports positive checks and negative self-test outcomes.',
              '- [ ] Confirm negative fixture remains intentionally invalid (missing `Founder approver:`).',
              '- [ ] Run local checks and capture evidence in a linked PR:',
              '  - `node scripts/legal/check-release-records.mjs`',
              '  - `node scripts/legal/check-release-template-drift.mjs`',
              '- [ ] Update `GOVERNANCE_CONTROLS_MATRIX.md` if legal control owner, automation, or evidence mapping changed this quarter.',
              '- [ ] Record review evidence in `legal/LEGAL_GOVERNANCE_RUNBOOK.md` under Quarterly Legal Drift Review Log.',
              '',
              '### Completion',
              '- [ ] Link follow-up PR(s) for any updates.',
              '- [ ] Close issue after drift review actions are complete.',
              '',
              '### KPI metadata',
              '- KPI label: `kpi:legal-drift-review`',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open',
                body,
                labels,
                assignees,
              });
              core.setOutput('operation', 'updated');
              core.setOutput('issue_number', String(existing.number));
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels,
                assignees,
              });
              core.setOutput('operation', 'created');
              core.setOutput('issue_number', String(created.data.number));
            }

      - name: Write summary
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "## Quarterly Legal Drift Issue" >> "$GITHUB_STEP_SUMMARY"
          echo "- operation: **${{ steps.upsert_legal_issue.outputs.operation }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- issue number: **#${{ steps.upsert_legal_issue.outputs.issue_number }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Note skip on non-default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "## Quarterly Legal Drift Issue" >> "$GITHUB_STEP_SUMMARY"
          echo "- issue upsert skipped on non-default branch \`${{ github.ref_name }}\` (default: \`${{ github.event.repository.default_branch }}\`)." >> "$GITHUB_STEP_SUMMARY"

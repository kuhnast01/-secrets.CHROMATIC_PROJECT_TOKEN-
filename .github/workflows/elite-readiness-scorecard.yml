name: Elite Readiness Scorecard

on:
  workflow_dispatch:
    inputs:
      target:
        description: Readiness target to evaluate
        required: true
        default: elite
        type: choice
        options:
          - elite
          - launch
      strict:
        description: Fail workflow when target criteria are not met
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "20 10 * * 1"

permissions:
  contents: read

concurrency:
  group: elite-readiness-scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elite-readiness-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run elite readiness check
        id: readiness
        continue-on-error: true
        run: |
          TARGET="${{ github.event.inputs.target || 'elite' }}"
          STRICT="${{ github.event.inputs.strict || 'false' }}"
          CMD="node scripts/governance/check-elite-readiness.mjs --target=${TARGET}"
          if [ "$STRICT" = "true" ]; then
            CMD="$CMD --strict"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          if [ -f governance-artifacts/elite-readiness-report.json ]; then
            node - <<'NODE'
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('governance-artifacts/elite-readiness-report.json', 'utf8'));
            const lines = [];
            lines.push('## Elite Readiness Scorecard');
            lines.push('');
            lines.push(`- target: \`${report.target}\``);
            lines.push(`- strict mode: \`${report.strictMode ? 'true' : 'false'}\``);
            lines.push(`- result: **${report.ok ? 'PASS' : 'FAIL'}**`);
            lines.push(`- completion: \`${report.summary.completed}/${report.summary.total}\` (\`${report.summary.completionPct}%\`)`);
            lines.push(`- baseline (*-01): **${report.summary.baselinePassed ? 'PASS' : 'FAIL'}**`);
            lines.push(`- elite ready: **${report.summary.eliteReady ? 'YES' : 'NO'}**`);
            lines.push(`- launch ready: **${report.summary.launchReady ? 'YES' : 'NO'}**`);
            lines.push('');
            lines.push('### Pillars');
            for (const pillar of report.pillars || []) {
              lines.push(`- Pillar ${pillar.number} (${pillar.name}): \`${pillar.completed}/${pillar.total}\``);
            }
            if (Array.isArray(report.strictFailures) && report.strictFailures.length > 0) {
              lines.push('');
              lines.push('### Strict Failures');
              for (const failure of report.strictFailures) {
                lines.push(`- ${failure}`);
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            NODE
          else
            echo "## Elite Readiness Scorecard" >> "$GITHUB_STEP_SUMMARY"
            echo "- result: **FAIL**" >> "$GITHUB_STEP_SUMMARY"
            echo "- report was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-readiness-report
          path: governance-artifacts/elite-readiness-report.json

      - name: Enforce strict readiness gate
        if: ${{ steps.readiness.outcome != 'success' && github.event.inputs.strict == 'true' }}
        run: |
          echo "Strict readiness gate failed. See summary and artifact." >&2
          exit 1

name: Backend Docs Freshness Quarterly Issue

on:
  schedule:
    - cron: "20 9 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      docsReviewAssignees:
        description: Comma-separated GitHub usernames to assign (overrides repository variable for this run)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: backend-docs-freshness-quarterly-issue
  cancel-in-progress: true

jobs:
  quarterly-docs-freshness-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCS_REVIEW_ASSIGNEES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.docsReviewAssignees || vars.DOCS_REVIEW_ASSIGNEES || '' }}
    steps:
      - name: Upsert quarterly docs freshness issue
        id: upsert_docs_issue
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- backend-docs-freshness-quarterly-issue -->';
            const title = 'Docs: Quarterly backend policy/runbook freshness review';
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');

            const targetDocs = [
              'backend/SECURITY.md',
              'backend/ONBOARDING.md',
              'backend/DOCUMENTATION_RUNBOOKS.md',
              'GOVERNANCE_CONTROLS_MATRIX.md',
            ];

            const configuredLabels = ['documentation', 'governance', 'backend'];
            let labels = [];
            try {
              const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
                owner,
                repo,
                per_page: 100,
              });
              const available = new Set(repoLabels.map((label) => label.name));
              labels = configuredLabels.filter((label) => available.has(label));
            } catch (error) {
              core.warning(`Unable to resolve repository labels: ${error.message}`);
            }

            const configuredAssignees = (process.env.DOCS_REVIEW_ASSIGNEES || '')
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const assignees = [];
            for (const username of configuredAssignees) {
              try {
                await github.rest.users.getByUsername({ username });
                assignees.push(username);
              } catch (error) {
                core.warning(`Skipping unknown assignee '${username}': ${error.message}`);
              }
            }

            const docsLines = targetDocs
              .map((path) => `- [ ] Review [${path}](../blob/${branch}/${path}) and update \`Last reviewed\` date if changes are made.`)
              .join('\n');

            const body = [
              marker,
              '## Quarterly Documentation Freshness Review',
              '',
              `- workflow run: ${runUrl}`,
              '- objective: keep policy/runbook onboarding docs current and review-stamped.',
              '',
              '### Review checklist',
              docsLines,
              '- [ ] Confirm related automation workflows and required checks still match documentation statements.',
              '- [ ] Update `GOVERNANCE_CONTROLS_MATRIX.md` if control owner, automation, or evidence mapping changed this quarter.',
              '- [ ] Record review evidence in `backend/DOCUMENTATION_RUNBOOKS.md` under the quarterly freshness log table.',
              '',
              '### Completion',
              '- [ ] Link follow-up PR(s) for any documentation updates.',
              '- [ ] Close issue after updates are merged and evidence is recorded.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open',
                body,
                labels,
                assignees,
              });
              core.setOutput('operation', 'updated');
              core.setOutput('issue_number', String(existing.number));
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels,
                assignees,
              });
              core.setOutput('operation', 'created');
              core.setOutput('issue_number', String(created.data.number));
            }

      - name: Write summary
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "## Quarterly Docs Freshness Issue" >> "$GITHUB_STEP_SUMMARY"
          echo "- operation: **${{ steps.upsert_docs_issue.outputs.operation }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- issue number: **#${{ steps.upsert_docs_issue.outputs.issue_number }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Note skip on non-default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "## Quarterly Docs Freshness Issue" >> "$GITHUB_STEP_SUMMARY"
          echo "- issue upsert skipped on non-default branch \`${{ github.ref_name }}\` (default: \`${{ github.event.repository.default_branch }}\`)." >> "$GITHUB_STEP_SUMMARY"
